name: Create Release
on:
  push:
    branches:
      - "release/**"
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_FLAG="--notes-file RELEASE_NOTES.md"
          else
            NOTES_FLAG="--generate-notes"
          fi
          if echo "$TAG" | grep -qE 'b[0-9]+'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "main" \
            --title "$TAG" \
            $NOTES_FLAG \
            $PRERELEASE_FLAG
      - name: Delete trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${GITHUB_REF_NAME}" || true
