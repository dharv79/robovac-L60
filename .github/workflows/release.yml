name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v1.0.5)"
        required: true
        type: string
      target:
        description: "Target commit-ish (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ inputs.target }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease == true && '--prerelease' || '' }}
