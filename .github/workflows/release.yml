name: Create Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v1.0.5)"
        required: true
        type: string
      target:
        description: "Target commit-ish (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            TARGET="${{ inputs.target }}"
            PRE="${{ inputs.prerelease == true && '--prerelease' || '' }}"
          else
            TAG="${GITHUB_REF_NAME#release/}"
            TARGET="main"
            PRE=""
          fi
          echo "Creating release $TAG targeting $TARGET"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes \
            $PRE

      - name: Delete trigger branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${GITHUB_REF_NAME}" || true
