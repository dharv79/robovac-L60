name: Create Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v1.0.6)"
        required: true
        type: string
      target:
        description: "Target commit-ish (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            TARGET="${{ inputs.target }}"
            PRE=${{ inputs.prerelease == true && '"--prerelease"' || '""' }}
          else
            TAG="${GITHUB_REF_NAME#release/}"
            TARGET="main"
            PRE=""
          fi

          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_FLAG="--notes-file RELEASE_NOTES.md"
          else
            NOTES_FLAG="--generate-notes"
          fi

          echo "Creating release $TAG targeting $TARGET (notes: $NOTES_FLAG)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "$TAG" \
            $NOTES_FLAG \
            $PRE

      - name: Delete trigger branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${GITHUB_REF_NAME}" || true
